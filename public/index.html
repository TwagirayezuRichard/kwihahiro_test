<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kwihahiro - Premium Shopping Experience</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .form-group {
            margin-bottom: 30px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        input[type="email"] {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        input[type="email"]:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .input-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #667eea;
            font-size: 18px;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 15px 20px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(45deg, #f093fb, #f5576c);
            color: white;
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.3);
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(245, 87, 108, 0.4);
        }

        .btn-full {
            grid-column: 1 / -1;
            background: linear-gradient(45deg, #4facfe, #00f2fe);
            color: white;
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.3);
        }

        .btn-full:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(79, 172, 254, 0.4);
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 10px;
            color: white;
            font-weight: 500;
            opacity: 0;
            transform: translateX(100%);
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .notification.show {
            opacity: 1;
            transform: translateX(0);
        }

        .notification.success {
            background: linear-gradient(45deg, #56ab2f, #a8e6cf);
        }

        .notification.error {
            background: linear-gradient(45deg, #ff6b6b, #ffa726);
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            .logo {
                font-size: 2rem;
            }

            .buttons-grid {
                grid-template-columns: 1fr;
            }

            .btn-full {
                grid-column: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Kwihahiro</div>
        <div class="subtitle">Your Premium Shopping Experience</div>

        <div class="form-group">
            <div class="input-group">
                <input type="email" id="email" placeholder="Enter your email address" required>
                <div class="input-icon">✉️</div>
            </div>
        </div>

        <div class="buttons-grid">
            <button class="btn btn-primary" onclick="signup()" id="signupBtn">
                <span class="btn-text">Sign Up</span>
            </button>
            <button class="btn btn-secondary" onclick="addToCart()" id="cartBtn">
                <span class="btn-text">Add to Cart</span>
            </button>
            <button class="btn btn-full" onclick="purchase()" id="purchaseBtn">
                <span class="btn-text">Complete Purchase</span>
            </button>
        </div>
    </div>

    <div id="notification" class="notification"></div>

    <script>
        async function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type} show`;

            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        function setLoading(buttonId, loading) {
            const button = document.getElementById(buttonId);
            const textSpan = button.querySelector('.btn-text');

            if (loading) {
                textSpan.innerHTML = '<div class="loading"></div>';
                button.disabled = true;
            } else {
                textSpan.textContent = buttonId === 'signupBtn' ? 'Sign Up' :
                                     buttonId === 'cartBtn' ? 'Add to Cart' : 'Complete Purchase';
                button.disabled = false;
            }
        }

        async function signup() {
            const email = document.getElementById("email").value;

            if (!email) {
                showNotification('Please enter your email address', 'error');
                return;
            }

            setLoading('signupBtn', true);

            try {
                const response = await fetch("/signup", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ email })
                });

                if (response.ok) {
                    showNotification('Welcome! You\'ve been signed up successfully!');
                    document.getElementById("email").value = '';
                } else {
                    throw new Error('Signup failed');
                }
            } catch (error) {
                showNotification('Signup failed. Please try again.', 'error');
            } finally {
                setLoading('signupBtn', false);
            }
        }

        async function addToCart() {
            const email = document.getElementById("email").value;

            if (!email) {
                showNotification('Please enter your email address', 'error');
                return;
            }

            setLoading('cartBtn', true);

            try {
                const response = await fetch("/cart", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                        email,
                        items: [{ name: "Premium Shoes", price: 20 }]
                    })
                });

                if (response.ok) {
                    showNotification('Item added to cart successfully!');
                } else {
                    throw new Error('Failed to add to cart');
                }
            } catch (error) {
                showNotification('Failed to add to cart. Please try again.', 'error');
            } finally {
                setLoading('cartBtn', false);
            }
        }

        async function purchase() {
            const email = document.getElementById("email").value;

            if (!email) {
                showNotification('Please enter your email address', 'error');
                return;
            }

            setLoading('purchaseBtn', true);

            try {
                const response = await fetch("/purchase", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                        email,
                        order: { total: 20 }
                    })
                });

                if (response.ok) {
                    showNotification('Purchase completed successfully! Thank you!');
                    document.getElementById("email").value = '';
                } else {
                    throw new Error('Purchase failed');
                }
            } catch (error) {
                showNotification('Purchase failed. Please try again.', 'error');
            } finally {
                setLoading('purchaseBtn', false);
            }
        }

        // Add enter key support
        document.getElementById('email').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                signup();
            }
        });
    </script>
</body>
</html>
